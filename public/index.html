<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup UI</title>
    <link rel="stylesheet" href="./stylesheets/styles.css">
    <link rel="stylesheet" href="./stylesheets/darktheme.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./javascripts/script.js" defer></script>
    <script src="./javascripts/settings.js" defer></script>
</head>

<body>
    <div class="container">
        <!-- sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>AI ChatBot</h1>
            </div>
            <!-- emojis from https://emojipedia.org/ -->
             <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button> 
             <!-- <button class="sidebar-btn" id="notes-btn">📝 Notes</button> -->
             <button class="sidebar-btn">💬 Chat History</button>
             <button class="sidebar-btn" id="settings-btn">⚙️ Settings</button>
        </div>

        <!-- Settings Popup -->
        <div id="popupOverlay" class="popup-overlay">
            <div class="popup">
                <div class="control-group">
                    <h2>Font Size Controls</h2>
                    <div class="font-controls">
                        <button id="decreaseFont" class="control-button">-</button>
                        <span id="fontSizeDisplay" class="font-size-display">16px</span>
                        <button id="increaseFont" class="control-button">+</button>
                    </div>
                </div>

                <div class="control-group">
                    <h2>Theme</h2>
                    <div class="theme-toggle">
                        <span>Light</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="themeToggle">
                            <span class="slider"></span>
                        </label>
                        <span>Dark</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- main chat area -->
        <div class="chat-container">
            <div class="chat-area">
                <ul class="chatbox">
                    <li class="chat-incoming chat">
                        <div class="message-content">
                            Hello!
                        </div>
                    </li>
                </ul>

                <div class="chat-input">
                    <textarea id="user-input" placeholder="Type your message..."></textarea>
                    <button id="sendBTN" onclick="handleChat()">↑</button>
                </div>
            </div>

            <!-- notes -->
            <div class="notes-panel hidden">
                <div class="notes-header">
                    <h2>Notes ✏️</h2>
                    <!-- <button class="close-btn">✕</button> -->
                </div>

                <div class="notes-content">
                    <div class="notes-input-area">
                        <textarea class="notes-input" id="notes-text-area" placeholder="Add a note..."></textarea>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
