language: node_js
node_js:
  - 16
cache:
  directories:
    - node_modules
before_install:
  # Create mock files to bypass problematic packages
  - mkdir -p .npm-mock/onnxruntime-node
  - echo '{"name":"onnxruntime-node","version":"1.0.0","main":"index.js"}' > .npm-mock/onnxruntime-node/package.json
  - echo 'module.exports = { InferenceSession: class {} };' > .npm-mock/onnxruntime-node/index.js
  - npm config set loglevel warn

