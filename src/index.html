<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup UI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>AI ChatBot</h1>
            </div>
            <!-- emojis from https://emojipedia.org/ -->
             <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
             <button class="sidebar-btn" id="notes-btn">📝 Notes</button>
             <button class="sidebar-btn">💬 Chat History</button>
             <button class="sidebar-btn">⚙️ Settings</button>
        </div>

        <!-- main chat area -->
        <div class="chat-container">
            <div class="chat-area">
                <ul class="chatbox">
                    <li class="chat-incoming chat">
                        <div class="message-content">
                            Hello!
                        </div>
                    </li>
                </ul>

                <div class="chat-input">
                    <textarea id="user-input" placeholder="Type your message..."></textarea>
                    <button id="sendBTN" onclick="handleChat()">↑</button>
                </div>
            </div>

            <!-- notes -->
            <div class="notes-panel hidden">
                <div class="notes-header">
                    <h2>Notes ✏️</h2>
                    <button class="close-btn">✕</button>
                </div>

                <div class="notes-content">
                    <div class="notes-input-area">
                        <textarea class="notes-input" id="notes-text-area" placeholder="Add a note..."></textarea>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js" defer></script>
    <script src="database.js" defer></script>
</body>
</html>
